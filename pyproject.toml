[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-mlops"
version = "0.1.0"
description = "End-to-end MLOps system for demand forecasting."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
mlflow = [
  "mlflow>=2.10",
]
spark = [
  "pyspark>=3.5",
  "delta-spark>=3.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mlops-demand = "mlops_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py310"
